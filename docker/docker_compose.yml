services:
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./mongodata:/data/db
    networks:
      - backend
    restart: always
    environment:
    - MongoDB_INITDB_ROOT_USERNAME=${ MongoDB_INITDB_ROOT_USERNAME}
    - MongoDB_INITDB_ROOT_PASSWORD=${ MongoDB_INITDB_ROOT_PASSWORD}

networks:
  backend: